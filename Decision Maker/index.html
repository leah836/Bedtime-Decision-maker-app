	<header>
		<h1>When to go to sleep</h1>
		<p>Enter your age, the time you should wake up, and your stress level and it will generate when you should go to sleep!</p>
	</header>

	<center>
		<label>Stress Level: </label>
    <select id="stress">
      <option value="one">1</option>
      <option value="two">2</option>
      <option value="three">3</option>
      <option value="four">4</option>
      <option value="five">5</option>
    </select>
    <br>
    <br>

    <label>Age: </label>
    <input type="text" id="age"><br><br>
    
    	<label>Were you extra tired today?: </label>
    <select id="tired">
      <option value="yes">Yes</option>
      <option value="no">No</option>
    </select>
    <br>
    <br>
   

    <button onclick="getBedtime()">Calculate my bedtime!</button>
